# 服务端口
server:
  port: 8088

spring:
  profiles:
   active: dev
  application:
    name: ext-service


# MyBatis-Plus 配置
mybatis-plus:
  type-enums-package: com.java110.ext.enums
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.java110.ext.pojo
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: statusCd
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
#    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    com.java110.ext: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
