version: '2'
services:
   api:
       container_name: api-1
       build:
          context: .
          dockerfile: Dockerfile
       restart: always
       ports:
       - "8008:8008"
       volumes:
       - ../target/service-api.jar:/root/target/service-api.jar
#       networks:
#       - java110-net
       mem_limit: 1536m
       extra_hosts:
       - "dev.java110.com:192.168.0.181"
       - "dev.db.java110.com:192.168.0.181"
       - "dev.zk.java110.com:192.168.0.181"
       - "dev.kafka.java110.com:192.168.0.181"
       - "dev.redis.java110.com:192.168.0.181"
       - "api.java110.com:192.168.0.181"
#networks:
#  java110-net:
#    external: true
