version: '2'
services:
   communityserivce:
       container_name: communityserivce-1
       build:
          context: .
          dockerfile: Dockerfile
       restart: always
       ports:
       - "8009:8009"
       volumes:
       - ../target/service-community.jar:/root/target/service-community.jar
#       networks:
#       - java110-net
#       mem_limit: 1536m
       extra_hosts:
       - "dev.java110.com:192.168.0.181"
       - "dev.db.java110.com:192.168.0.181"
       - "dev.zk.java110.com:192.168.0.181"
       - "dev.kafka.java110.com:192.168.0.181"
       - "dev.redis.java110.com:192.168.0.181"
       - "prod.java110.com:192.168.0.181"
       - "prod.db.java110.com:192.168.0.181"
       - "prod.zk.java110.com:192.168.0.181"
       - "prod.kafka.java110.com:192.168.0.181"
       - "prod.redis.java110.com:192.168.0.181"
       - "api.java110.com:192.168.0.181"
       environment:
       - SPRING_REDIS_DATABASE=10
#networks:
#  java110-net:
#    external: true
