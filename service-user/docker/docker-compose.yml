version: '2'
services:
   userservice:
       container_name: userservice-1
       build:
          context: .
          dockerfile: Dockerfile
       restart: always
       ports:
       - "8002:8002"
       volumes:
       - ../target/service-user.jar:/root/target/service-user.jar
#       networks:
#       - java110-net
#       mem_limit: 1536m
       extra_hosts:
       - "dev.java110.com:192.168.0.181"
       - "dev.db.java110.com:192.168.0.181"
       - "dev.zk.java110.com:192.168.0.181"
       - "dev.kafka.java110.com:192.168.0.181"
       - "dev.redis.java110.com:192.168.0.181"
       - "api.java110.com:192.168.0.181"
